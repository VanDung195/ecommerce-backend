version: '3.8'
services:
  app:
    image: ${REGISTRY_URL}/${REGISTRY_USER}/${CI_PROJECT_NAME}:${CI_COMMIT_TAG}_${CI_COMMIT_SHORT_SHA}
    # container_name: ecommerce-backend
    container_name: ${CI_PROJECT_NAME}
    ports:
      - "3052:3052"
    environment:
      - MONGO_URL=mongodb://mongo:27017/mydb
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://rabbitmq
    depends_on:
      - mongo
      - redis
      - rabbitmq
    restart: always
  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"       
      - "15672:15672"     
